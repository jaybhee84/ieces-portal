name: IECES Portal App

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Git Tag from Commit Message
        id: autotag
        uses: leadschool/action-autotag@v1.3.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          regex_pattern: 'v[0-9]+\.[0-9]+\.[0-9]+'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build and Publish Electron App
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run electron:build:publish
