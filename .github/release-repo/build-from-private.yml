name: Build Release from private source

# Lives in the PUBLIC release repo (buzzjay84/ieces-portal) as
# .github/workflows/build-from-private.yml. A copy is kept in the private
# source at .github/release-repo/build-from-private.yml. Actions on a public
# repository are free, so the installer is built here. The private source
# (jaybhee84/ieces-portal) is checked out read-only with a deploy key, tested,
# built, and the installer is published to THIS repo's Releases.
#
# Started by watch-private.yml when the private source's version changes, or
# by hand:
#   gh workflow run build-from-private.yml -R buzzjay84/ieces-portal -f tag=v3.0.9 -f ref=main
#
# One tag, one release (as in Tax-E): create-release makes a single draft
# release first, the Windows build uploads into it, and publish-release makes
# it public only after the build succeeds. Windows only; no macOS build.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to publish, e.g. v3.0.9 (must equal package.json version at ref)'
        required: true
        type: string
      ref:
        description: 'Branch, tag or commit of the private source to build (default: the tag)'
        required: false
        type: string
  repository_dispatch:
    types: [build-release]

permissions:
  contents: write

concurrency:
  group: build-release-${{ github.event.inputs.tag || github.event.client_payload.tag }}
  cancel-in-progress: false

env:
  SOURCE_REPO: jaybhee84/ieces-portal
  RELEASE_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
  SOURCE_REF: ${{ github.event.inputs.ref || github.event.client_payload.ref || github.event.inputs.tag || github.event.client_payload.tag }}

jobs:
  check-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Tag must look like vX.Y.Z
        shell: bash
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$RELEASE_TAG' is not a release tag like v3.0.9" >&2
            exit 1
          fi

  create-release:
    needs: check-tag
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release the build uploads into
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" --json isDraft --jq .isDraft 2>/dev/null | grep -q false; then
            echo "::error::$RELEASE_TAG is already published; bump the version for a new release." >&2
            exit 1
          elif gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Draft release $RELEASE_TAG exists; the build will upload into it."
          else
            gh release create "$RELEASE_TAG" --repo "${{ github.repository }}" --draft --title "${RELEASE_TAG#v}" --notes ""
          fi

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      # Read-only deploy key for the private repo. The key is never printed and no credentials are
      # left in the workspace. Logs of a public repo are public, so nothing here echoes source.
      - name: Check out private source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_REF }}
          ssh-key: ${{ secrets.PRIVATE_SOURCE_DEPLOY_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $packageVersion = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "Tag $env:RELEASE_TAG must match package.json version $packageVersion."
          }

      - run: npm ci
      - run: npm test

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" release/IECES-Portal-Setup-*.exe release/IECES-Portal-Setup-*.exe.blockmap release/latest.yml --repo "${{ github.repository }}" --clobber

  publish-release:
    needs: build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest --repo "${{ github.repository }}"
