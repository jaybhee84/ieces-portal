# Keeps the IECES Supabase project from being paused.
#
# Free Supabase projects are paused after about 7 days without activity
# (e.g. school breaks). This makes one small read-only database request every
# Monday and Thursday so the project always counts as active. Two runs a week
# leave a safety margin, since GitHub can delay or skip scheduled runs.
#
# The key below is the publishable (public) key already shipped in
# src/lib/supabase.js; it can only do what Row Level Security allows.
# If a run fails, GitHub emails the repository owner.

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * 1,4" # Mon & Thu 01:17 UTC (09:17 Philippine time)
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://joilvslvsioayrjshuxg.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_aozkBamT5C58KY03X9kUgA_iehy73ZU
    steps:
      - name: Query the database
        run: |
          status=$(curl --silent --show-error --output response.txt \
            --write-out "%{http_code}" --retry 3 --retry-delay 20 \
            "$SUPABASE_URL/rest/v1/schools?select=school_id&limit=1" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" != "200" ]; then
            cat response.txt
            echo "::error::Supabase did not respond normally (HTTP $status). The project may be paused - check the Supabase dashboard."
            exit 1
          fi
